services:
    _defaults:
        autowire: true
        autoconfigure: true

    Derkosmonaut\NightmodeBundle\Schedule\NullScheduleProvider: ~

    # Wird von services_opentimes.yaml überschrieben, wenn OpenTimes installiert ist
    Derkosmonaut\NightmodeBundle\Schedule\ScheduleProviderInterface:
        alias: Derkosmonaut\NightmodeBundle\Schedule\NullScheduleProvider

    Derkosmonaut\NightmodeBundle\Screen\:
        resource: ../src/Screen/
        exclude:
            - ../src/Screen/ScreenConfig.php
            - ../src/Screen/ScreenState.php

    Derkosmonaut\NightmodeBundle\EventListener\:
        resource: ../src/EventListener/
