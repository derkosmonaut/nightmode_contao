services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Öffnungszeiten aus derkosmonaut/opentimes-contao
    Derkosmonaut\NightmodeBundle\Integration\OpenTimes\OpenTimesScheduleProvider: ~

    Derkosmonaut\NightmodeBundle\Schedule\ScheduleProviderInterface:
        alias: Derkosmonaut\NightmodeBundle\Integration\OpenTimes\OpenTimesScheduleProvider

    Derkosmonaut\NightmodeBundle\Screen\:
        resource: ../src/Screen/
        exclude:
            - ../src/Screen/ScreenConfig.php
            - ../src/Screen/ScreenState.php

    Derkosmonaut\NightmodeBundle\EventListener\:
        resource: ../src/EventListener/
